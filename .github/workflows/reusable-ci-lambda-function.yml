name: Reusable CI Lambda Function

on:
  workflow_call:
    inputs:
      config_dir:
        description: 'Lambda function files dir'
        type: string
        required: true
      artifact_name:
        description: 'Artifact Name to upload'
        type: string
        required: true
    secrets:
      gh_pat_token:
        required: true

jobs:
    build-lambda:
      name: "Build Lambda Function"
      runs-on: ubuntu-latest
      permissions:
        contents: read      
      steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.gh_pat_token }}

      - name: Build Lambda package in container
        working-directory: ${{ inputs.config_dir }}
        run: |
          ls -l
          docker build -t aws_lambda_img .

      - name: Run Docker image
        working-directory: ${{ inputs.config_dir }}
        run: |
          docker run --name lambda_payload_builder aws_lambda_img

      - name: Copy and validate lambda payload
        working-directory: ${{ inputs.config_dir }}
        run: |
          PAYLOAD="${{ inputs.artifact_name }}.zip"
          lambda_function_payload_dir="./lambda/"
          docker cp lambda_payload_builder:/app/lambda_function_payload.zip $PAYLOAD
  
          package_size=$(du -m "$PAYLOAD" | cut -f1)
          echo "payload size: $package_size mb"
          if (( package_size > 50 )); then
              echo -e "Error: \nThe lambda_function_payload is larger than 50 MB \nDoc: https://docs.aws.amazon.com/lambda/latest/dg/python-package.html"
              exit 1
          fi

      - name: Upload lambda function payload
        uses: actions/upload-artifact@v2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.config_dir }}/${{ inputs.artifact_name }}.zip