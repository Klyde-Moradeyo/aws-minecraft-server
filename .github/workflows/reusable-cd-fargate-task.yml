name: Reusable fargate Task

on:
  workflow_call:
    inputs:
      working_dir:
        description: 'Fargate Task Directory'
        type: string
        required: true
      tf_config_dir:
        description: 'Infrastructure handler Terraform manifest directory'
        type: string
        required: true
      image_artifact_name:
        description: 'Fargate Image Artifact Name'
        type: string
        required: true
      image_tar_name:
        description: 'Fargate Image Tar Name'
        type: string
        required: true
      image_tag:
        description: 'Fargate Image Tar Name'
        type: string
        required: true
    secrets:
      gh_pat_token:
        required: true
      aws_id:
        required: true
      aws_key:
        required: true
      ssh_private_key:
        required: true

env:
    AWS_REGION: "eu-west-2"

jobs:
    push-fargate:
        name: "Push fargate task"
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v3
          with:
            fetch-depth: 0
            token: ${{ secrets.gh_pat_token }}

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4.0.1
          with:
            aws-access-key-id: ${{ secrets.aws_id }}
            aws-secret-access-key: ${{ secrets.aws_key }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Login to ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v1

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v2
          with:
            terraform_version: 1.5.7
            terraform_wrapper: false

        - name: Setup SSH Key
          env:
            SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          run: |
            mkdir -p ~/.ssh
            echo "${{ env.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            
        - name: Set Terraform State File Location
          working-directory: ${{ inputs.tf_config_dir }}
          run: |
            # Define the branch name
            BRANCH=${{ github.ref }}
            BRANCH=${BRANCH#refs/heads/}

            # Path to your Terraform file
            TF_FILE="versions.tf"

            # Use sed to replace the placeholder
            sed -i "s/<GITHUB_BRANCH>/$BRANCH/g" $TF_FILE

            cat $TF_FILE   

        - name: Initialize Terraform Env
          working-directory: ${{ inputs.tf_config_dir }}
          run: |
            terraform init

            # Attempt to capture the Terraform output
            ECR_REPO_NAME=$(terraform output -raw ecr_mc_world_archive_repository_name || echo "")

            # Check if the Terraform output is non-empty
            if [ -z "$ECR_REPO_NAME" ]; then
                echo "RUN_STEPS=false" >> $GITHUB_ENV
            else
                echo "ECR_REPO_NAME=$ECR_REPO_NAME" >> $GITHUB_ENV
                echo "RUN_STEPS=true" >> $GITHUB_ENV
            fi

        - name: Download Docker image from artifact
          uses: actions/download-artifact@v2
          if: ${{ env.RUN_STEPS == 'true' }}
          with:
            name: ${{ inputs.image_artifact_name }}
        
        - name: Load Docker image
          if: ${{ env.RUN_STEPS == 'true' }}
          run: |
            docker load < ${{ inputs.image_tar_name }}

        - name: Push Fargate Image
          if: ${{ env.RUN_STEPS == 'true' }}
          working-directory: ${{ inputs.working_dir }}
          env:
            REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          run: |
            docker push ${{ env.REGISTRY }}/${{ env.ECR_REPO_NAME }}:${{ inputs.IMAGE_TAG }}
