name: Reusable CI Lambda Function

on:
  workflow_call:
    inputs:
      working_dir:
        description: 'Fargate Task Directory'
        type: string
        required: true
      tf_config_dir:
        description: 'Infrastructure handler Terraform manifest directory'
        type: string
        required: true
      aws_region:
        description: 'AWS Region for the Terraform backend'
        type: string
        required: true
    secrets:
      gh_pat_token:
        required: true
      aws_id:
        required: true
      aws_key:
        required: true
      ssh_private_key:
        required: true
    outputs:
      artifact_name:
        description: "Artifact name"
        value: ${{ jobs.build-fargate.outputs.artifact_name }}
      docker_tar_file_name:
        description: "Docker Tar File Name"
        value: ${{ jobs.build-fargate.outputs.docker_tar_file_name }}
      image_tag:
        description: "IMAGE_TAG"
        value: ${{ jobs.build-fargate.outputs.image_tag }}

env:
    IMAGE_NAME: "mc_world_archiver"
    IMAGE_TAG: "latest"
    OUTPUT_ARTIFACT: "fargate_task.tar"

jobs:
    build-fargate:
        name: "Build fargate task"
        runs-on: ubuntu-latest
        outputs:
          artifact_name: ${{ steps.set-vars.outputs.artifact_name }}
          docker_tar_file_name: ${{ steps.set-vars.outputs.docker_tar_file_name }}
          image_tag: ${{ steps.set-vars.outputs.image_tag }}
        steps:
        - name: Checkout code
          uses: actions/checkout@v3
          with:
            fetch-depth: 0
            token: ${{ secrets.gh_pat_token }}

        - name: Install jq
          run: sudo apt-get update && sudo apt-get install -y jq          

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4.0.1
          with:
            aws-access-key-id: ${{ secrets.aws_id }}
            aws-secret-access-key: ${{ secrets.aws_key }}
            aws-region: ${{ inputs.aws_region }}

        - name: Login to ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v1

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: 1.6.3
            terraform_wrapper: false

        - name: Setup SSH Key
          env:
            SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          run: |
            mkdir -p ~/.ssh
            echo "${{ env.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan github.com >> ~/.ssh/known_hosts 

        - name: Set Terraform State File Location
          working-directory: ${{ inputs.tf_config_dir }}
          run: |
            # Define the branch name
            BRANCH=${{ github.ref }}
            BRANCH=${BRANCH#refs/heads/}
            BRANCH=$(echo $BRANCH | sed 's/\//\\\//g')

            # Path to your Terraform file
            TF_FILE="versions.tf"

            # Use sed to replace the placeholder
            sed -i "s/<GITHUB_BRANCH>/$BRANCH/g" $TF_FILE

            cat $TF_FILE
            
        - name: Initialize Terraform Env
          working-directory: ${{ inputs.tf_config_dir }}
          run: |
            terraform init

            # Attempt to capture the Terraform output
            JSON_OUTPUT=$(terraform output -raw ecs_mc_archive_container_definitions)

            # Get ECR image arn
            ECR_IMAGE_ARN=$(echo $JSON_OUTPUT | jq -r '.["minecraft-server-world-archive-runner"].image')
            echo "ECR_IMAGE_ARN=$ECR_IMAGE_ARN" >> $GITHUB_ENV

            # Check if the Terraform output is non-empty
            if [ -z "$ECR_IMAGE_ARN" ]; then
                echo "RUN_STEPS=false" >> $GITHUB_ENV
            else
                echo "ECR_IMAGE_ARN=$ECR_IMAGE_ARN" >> $GITHUB_ENV
                echo "RUN_STEPS=true" >> $GITHUB_ENV
            fi

        - name: Build Fargate Image
          if: env.RUN_STEPS == 'true'
          working-directory: ${{ inputs.working_dir }}
          env:
            REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          run: |
            docker build -t ${{ env.ECR_IMAGE_ARN }} .
          
        - name: Save Docker image
          env:
            REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          run: |
            docker save ${{ env.ECR_IMAGE_ARN }} > ${{ env.OUTPUT_ARTIFACT }}

            # Artifact name
            ARTIFACT_NAME="fargate-docker-image-${{ github.run_id }}"
            echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
            
        - name: Set Output Vars
          id: set-vars
          if: env.RUN_STEPS == 'true'
          run: |
            # Outputs
            echo "docker_tar_file_name=${{ env.OUTPUT_ARTIFACT }}" >> "$GITHUB_OUTPUT"
            echo "image_tag=${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
            echo "artifact_name=${{ env.ARTIFACT_NAME }}" >> "$GITHUB_OUTPUT"
            
        - name: Upload Docker image as artifact
          uses: actions/upload-artifact@v2
          with:
            name: ${{ env.ARTIFACT_NAME }}
            path: ${{ env.OUTPUT_ARTIFACT }}