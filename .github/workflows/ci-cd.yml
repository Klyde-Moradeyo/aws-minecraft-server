name: CI/CD Infra handler + lambda

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "terraform/**"
      - "lambda/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

jobs:
  set-env-vars:
    runs-on: ubuntu-latest
    outputs:
      tf_config_directory: ${{ steps.set-env.outputs.tf_config_directory }}
      git_tag_prefix: ${{ steps.set-env.outputs.git_tag_prefix }}
    steps:
    - name: Set Env Vars 
      id: set-env
      run: |
        ##### DEVELOPMENT ENVIRONMENT #####
        if [ "${{ github.ref }}" == "refs/heads/dev" ]; then
          TF_DIR="./terraform"
  
        ##### PRODUCTION ENVIRONMENT #####
        elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
        TF_DIR="./terraform" 
        fi

        GIT_TAG_PREFIX="MSIH" # MSIH means Minecraft Server Infrastructure Handler
  
        echo "tf_config_directory=$TF_DIR" >> "$GITHUB_OUTPUT"
        echo "git_tag_prefix=$GIT_TAG_PREFIX" >> "$GITHUB_OUTPUT"

  filter:
    runs-on: ubuntu-latest
    needs: [ set-env-vars ] 
    outputs:
      lambda: ${{ steps.filter.outputs.lambda }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            lambda:
              - 'lambda/**'
            terraform:
              - '${{ needs.set-env-vars.outputs.tf_config_directory }}/**'

  ci-lambda:
    uses: Klyde-Moradeyo/aws-minecraft-server/.github/workflows/reusable-ci-lambda-function.yml@github-workflows
    needs: [ filter, set-env-vars ]   
    with:
      filter: ${{ needs.filter.outputs.lambda }}
      config_dir: "./lambda"
    secrets:
      gh_pat_token: ${{ secrets.GH_PAT }}

  cd-terraform-apply:
    needs: [ ci-lambda, set-env-vars ]
    uses: Klyde-Moradeyo/aws-minecraft-server/.github/workflows/reusable-cd-terraform-apply.yml@github-workflows
    with:
      config_dir: ${{ needs.set-env-vars.outputs.tf_config_directory }}
      filter: ${{ needs.filter.outputs.terraform }}
      aws_region: "eu-west-2"
    secrets:
      gh_pat_token: ${{ secrets.GH_PAT }}
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  git-tag:
    uses: Klyde-Moradeyo/aws-minecraft-server/.github/workflows/reusable-git-tag.yml@github-workflows
    needs: [ cd-terraform-apply, set-env-vars ]
    with:
      git_tag_prefix: ${{ needs.set-env-vars.outputs.git_tag_prefix }}
    secrets:
      gh_pat_token: ${{ secrets.GH_PAT }}