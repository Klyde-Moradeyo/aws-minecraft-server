name: CI/CD Infra handler + lambda

on:
  push:
    branches:
      - main
      - dev
      - prod
    paths:
      - "terraform/**"
      - "lambda/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

jobs:
  ci-request-lambda:
    uses: Klyde-Moradeyo/aws-minecraft-server/.github/workflows/reusable-ci-lambda-function.yml@github-workflows
    with:
      config_dir: "./lambda/request"
      artifact_name: "request_lambda_latest"
    secrets:
      gh_pat_token: ${{ secrets.GH_PAT }}

  ci-worker-lambda:
    uses: Klyde-Moradeyo/aws-minecraft-server/.github/workflows/reusable-ci-lambda-function.yml@github-workflows
    with:
      config_dir: "./lambda/worker"
      artifact_name: "worker_lambda_latest"
    secrets:
      gh_pat_token: ${{ secrets.GH_PAT }}

  # Build Fargate

  cd-terraform-apply:
    needs: [ ci-worker-lambda, ci-request-lambda ]
    uses: Klyde-Moradeyo/aws-minecraft-server/.github/workflows/reusable-cd-terraform-apply.yml@github-workflows
    with:
      config_dir: terraform
      aws_region: "eu-west-2"
    secrets:
      gh_pat_token: ${{ secrets.GH_PAT }}
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

  git-tag:
    uses: Klyde-Moradeyo/aws-minecraft-server/.github/workflows/reusable-git-tag.yml@github-workflows
    needs: [ cd-terraform-apply ]
    if: github.ref == 'refs/heads/main'
    with:
      git_tag_prefix: "MSI" # Minecraft Server Infrastructure (MCI)
    secrets:
      gh_pat_token: ${{ secrets.GH_PAT }}