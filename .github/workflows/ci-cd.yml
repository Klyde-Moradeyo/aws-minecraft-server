name: CI/CD Infra handler + lambda

on:
  push:
    branches:
      - main
      - dev
      - prod
    paths:
      - "terraform/**"
      - "lambda/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

jobs:
  ci-request-lambda:
    uses: Klyde-Moradeyo/aws-minecraft-server/.github/workflows/reusable-ci-lambda-function.yml@github-workflows
    with:
      config_dir: "./lambda/request"
      artifact_name: "request_lambda_latest"
    secrets:
      gh_pat_token: ${{ secrets.GH_PAT }}

  ci-worker-lambda:
    uses: Klyde-Moradeyo/aws-minecraft-server/.github/workflows/reusable-ci-lambda-function.yml@github-workflows
    with:
      config_dir: "./lambda/worker"
      artifact_name: "worker_lambda_latest"
    secrets:
      gh_pat_token: ${{ secrets.GH_PAT }}

  # Build Fargate
  ci-fargate:
    name: Fargate MC World Archiver - CI
    uses: Klyde-Moradeyo/aws-minecraft-server/.github/workflows/reusable-ci-fargate-task.yml@github-workflows
    with:
      TF_CONFIG_DIR: terraform
      WORKING_DIR: "fargate/mc_world_archiver"
    secrets:
      gh_pat_token: ${{ secrets.GH_PAT }}
      aws_id: ${{ secrets.AWS_ACCESS_KEY }}
      aws_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

  cd-fargate:
    name: Fargate MC World Archiver - CD
    uses: Klyde-Moradeyo/aws-minecraft-server/.github/workflows/reusable-cd-fargate-task.yml@github-workflows
    needs: [ ci-fargate ]
    with:
      tf_config_dir: terraform
      working_dir: "fargate/mc_world_archiver"
      image_artifact_name: ${{ needs.ci-fargate.outputs.artifact_name }}
      image_tar_name: ${{ needs.ci-fargate.outputs.docker_tar_file_name }}
      image_tag: ${{ needs.ci-fargate.outputs.image_tag }}
    secrets:
      gh_pat_token: ${{ secrets.GH_PAT }}
      aws_id: ${{ secrets.AWS_ACCESS_KEY }}
      aws_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}  

  cd-terraform-apply:
    needs: [ ci-worker-lambda, cd-fargate ]
    uses: Klyde-Moradeyo/aws-minecraft-server/.github/workflows/reusable-cd-terraform-apply.yml@github-workflows
    with:
      config_dir: terraform
      aws_region: "eu-west-2"
    secrets:
      gh_pat_token: ${{ secrets.GH_PAT }}
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

  git-tag:
    uses: Klyde-Moradeyo/aws-minecraft-server/.github/workflows/reusable-git-tag.yml@github-workflows
    needs: [ cd-terraform-apply, cd-fargate ]
    if: github.ref == 'refs/heads/main'
    with:
      git_tag_prefix: "MSI" # Minecraft Server Infrastructure (MCI)
    secrets:
      gh_pat_token: ${{ secrets.GH_PAT }}