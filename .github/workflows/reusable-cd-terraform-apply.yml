name: Reusable Terraform apply

on:
  workflow_call:
    inputs:
      filter:
        description: 'Filter'
        type: string
        required: true
      config_dir:
        description: 'Terraform Config Directory'
        type: string
        required: true
      aws_region:
        description: 'AWS Region for the Terraform backend'
        type: string
        required: true
    secrets:
      aws_access_key_id:
        required: true
      aws_secret_access_key:
        required: true
      gh_pat_token:
        required: true

env:
    GIT_TAG_PREFIX: "SIOS" # Serverless Infrastructure Orchestration System

jobs:
  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.gh_pat_token }}

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ inputs.aws_region }}

      - name: Download lambda function payload
        uses: actions/download-artifact@v2
        with:
          name: lambda-artifact
          path: ${{ inputs.config_dir }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: "1.5.7"

      - name: Terraform 
        working-directory: ${{ inputs.config_dir }}
        run: |
          terraform init -input=false

      - name: Terraform Plan
        working-directory: ${{ inputs.config_dir }}
        run: |
          terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ inputs.config_dir }}
        run: |
          terraform apply -input=false -auto-approve tfplan
