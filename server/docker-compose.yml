version: "3.9"

services:
  mc-server:
    container_name: mc-server
    image: itzg/minecraft-server:java17
    env_file: config/.server-env
    volumes:
      - ./minecraft-data:/data
    ports:
      - 25565:25565
      - 25585:25585 # Prometheus Fabric Exporter
      - 24454:24454 # Simple Voice Chat Mod
    tty: true
    stdin_open: true
    restart: unless-stopped

  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - 9149:8080
    restart: unless-stopped
    mem_limit: 128M
    cpus: 0.1

  minecraft-exporter:
    container_name: minecraft-exporter
    image: klydem/minecraft-exporter
    env_file: config/.monitoring-env
    volumes:
      - ./minecraft-data/world:/world:ro
    ports:
      - 9150:8000
    restart: unless-stopped
    mem_limit: 64M
    cpus: 0.02

  mc-player-activity-watchdog:
    container_name: mc-player-activity-watchdog
    image: klydem/mc-player-activity-monitor
    env_file: config/.monitoring-env
    volumes:
      - .:/app
    restart: unless-stopped
    mem_limit: 64M
    cpus: 0.02

volumes:
  minecraftdata:
    external: true
