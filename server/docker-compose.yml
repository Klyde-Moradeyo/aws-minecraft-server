version: "3.9"

services:
  mc-server:
    container_name: mc-server
    image: itzg/minecraft-server:java17
    env_file: config/.server-env
    volumes:
      # attach a directory relative to the directory containing this compose file
      - ./minecraft-data:/data
    ports:
      - 25565:25565
    tty: true
    stdin_open: true
    restart: unless-stopped

volumes:
  minecraftdata:
    external: true